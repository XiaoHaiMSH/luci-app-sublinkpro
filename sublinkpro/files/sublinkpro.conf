config sublinkpro 'main'
	option enabled '0'
	option port '8000'
	# 数据目录 (SQLite 数据库 / config.yaml / GeoIP)。建议改到 U 盘或硬盘，减少闪存写入
	option db_path '/etc/sublinkpro'
	option log_path '/var/log/sublinkpro'
	# debug / info / warn / error / fatal
	option log_level 'info'
	option expire_days '14'
	# 前端访问路径前缀，例如 /admin，留空则不隐藏
	option web_base_path ''
	# 1=关闭验证码 2=图形验证码 3=Cloudflare Turnstile
	option captcha_mode '2'
	option login_fail_count '5'
	option login_fail_window '1'
	option login_ban_duration '10'
	# 初始管理员密码，仅首次初始化时生效，留空则用默认密码
	option admin_password ''
	# 自定义数据库 DSN (留空使用 SQLite)，如 mysql://user:pass@tcp(host:3306)/sublink
	option dsn ''
	option open_firewall '0'
